<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>موقع التهنئة</title>
    <link href="https://fonts.googleapis.com/css2?family=Almarai:wght@700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Almarai', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            background-color: #f0f8f8;
            padding: 20px;
            margin: 0;
        }
        .container {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            text-align: center;
            margin-bottom: 20px;
            width: 100%;
            max-width: 400px;
        }
        input {
            padding: 12px;
            font-family: 'Almarai', sans-serif;
            font-size: 16px;
            margin-bottom: 15px;
            border: 1px solid #ccc;
            border-radius: 5px;
            width: 80%;
            text-align: center;
        }
        button {
            padding: 12px 25px;
            font-family: 'Almarai', sans-serif;
            font-size: 16px;
            background-color: #005a56;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            width: 85%;
        }
        button:hover {
            background-color: #004542;
        }
        canvas {
            max-width: 100%;
            height: auto;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
    </style>
</head>
<body>

    <div class="container">
        <input type="text" id="nameInput" placeholder="اكتب اسمك هنا..." />
        <br>
        <button id="downloadBtn">تنزيل الصورة الخاصة بك</button>
    </div>

    <canvas id="canvas"></canvas>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const nameInput = document.getElementById('nameInput');
        const downloadBtn = document.getElementById('downloadBtn');

        const image = new Image();
        image.crossOrigin = "Anonymous"; 
        image.src = 'https://raw.githubusercontent.com/BaselGhanem/DAD-Eid-Greeting/refs/heads/main/Eid%20Greeting%202026.jpg';

        image.onload = () => {
            canvas.width = image.width;
            canvas.height = image.height;
            draw();
        };

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.drawImage(image, 0, 0);

            const name = nameInput.value;
            if (name) {
                const fontSize = canvas.width * 0.05; 
                ctx.font = `bold ${fontSize}px Almarai`;
                ctx.fillStyle = '#005a56'; 
                ctx.textAlign = 'center';
                
                const x = canvas.width / 2;
                const y = canvas.height * 0.76; 
                
                ctx.fillText(name, x, y);
            }
        }

        nameInput.addEventListener('input', draw);

        document.fonts.ready.then(() => {
            if (image.complete) draw();
        });

        downloadBtn.addEventListener('click', () => {
            const link = document.createElement('a');
            link.download = 'Eid_Mubarak_' + (nameInput.value || 'Card') + '.jpg';
            link.href = canvas.toDataURL('image/jpeg', 1.0);
            link.click();
        });
    </script>
</body>
</html>
